
<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Presupuestos 2N | Portal de Prescripción</title>

    <!-- Google Fonts: Inter para look SaaS Pro -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    
    <link rel="stylesheet" href="style.css" />
    <link rel="icon" href="favicon.svg" type="image/svg+xml" />
  </head>

  <body>
    <!-- LOGIN: Modern SaaS Gateway -->
    <div id="loginPage" class="login-page">
      <div class="login-container">
        <div class="login-box">
          <header class="login-header">
            <div class="brand-logo" style="width:fit-content; margin:0 auto 1rem;">2N</div>
            <h1 class="login-title">Portal de Prescripción</h1>
            <p class="login-desc">Gestiona tus proyectos técnicos con 2N.</p>
          </header>

          <div class="login-form">
            <div class="field-group">
              <label for="loginEmail">Email Corporativo</label>
              <input id="loginEmail" type="email" placeholder="nombre@empresa.com" required />
            </div>

            <div class="field-group">
              <label for="loginPass">Contraseña</label>
              <input id="loginPass" type="password" placeholder="••••••••" required />
            </div>

            <button id="btnLogin" class="btn btn-primary btn-block" style="margin-top:1rem;">
              Entrar al Portal
              <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="5" y1="12" x2="19" y2="12"></line><polyline points="12 5 19 12 12 19"></polyline></svg>
            </button>

            <div id="loginError" class="alert-error" style="display: none"></div>
          </div>
          
          <footer class="login-footer">
            <span>Presupuestos 2N &copy; 2026</span>
          </footer>
        </div>
      </div>
    </div>

    <!-- MAIN APP SHELL -->
    <div id="appShell" class="app-shell" style="display: none">
      <header class="top-bar">
        <div class="top-bar-container">
          <div class="brand">
            <span class="brand-logo">2N</span>
            <span class="brand-name" style="font-weight:800; font-size:1.1rem;">Portal de Prescripción</span>
          </div>

          <nav class="main-nav">
            <div class="nav-links" id="navContainer">
              <a href="#" class="nav-item active" data-view="proyecto" id="navProyecto">Proyecto</a>
              <a href="#" class="nav-item" data-view="presupuesto">Presupuesto</a>
              <a href="#" class="nav-item" data-view="simulador">Simulador</a>
              <a href="#" class="nav-item" data-view="tarifa">Tarifa 2N</a>
              <a href="#" class="nav-item" data-view="tarifas">Tarifas</a>
              <a href="#" class="nav-item" data-view="documentacion">Docs</a>
              <a href="#" class="nav-item" data-view="prescripcion">Prescripción</a>
              <a href="#" class="nav-item" data-view="diagramas">Diagramas</a>
              <a href="#" class="nav-item" data-view="docGestion">Gestión</a>
              <a href="#" class="nav-item" data-view="usuarios" id="navUsuarios" style="display:none;">Usuarios</a>
            </div>
          </nav>

          <div class="user-actions">
            <span id="userBadge" class="user-name">Usuario</span>
            <button id="btnLogout" class="btn-icon-logout" title="Cerrar sesión">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path><polyline points="16 17 21 12 16 7"></polyline><line x1="21" y1="12" x2="9" y2="12"></line></svg>
            </button>
          </div>
        </div>
      </header>

      <main id="appContent" class="main-content"></main>
    </div>

    <!-- MODAL SYSTEM -->
    <div id="prescModal" class="modal-system" style="display:none;">
      <div class="modal-overlay"></div>
      <div class="modal-wrapper">
        <div class="modal-card">
          <div class="modal-head">
            <h3 id="prescModalTitle">Detalle de Item</h3>
            <button id="prescModalClose" class="btn-close">&times;</button>
          </div>
          <div id="prescModalBody" class="modal-body"></div>
          <div class="modal-foot">
            <button id="prescModalCancel" class="btn btn-secondary">Cancelar</button>
            <button id="prescModalSave" class="btn btn-primary">Guardar Cambios</button>
          </div>
        </div>
      </div>
    </div>

    <!-- SCRIPTS -->
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-storage-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-functions-compat.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/exceljs@4.4.0/dist/exceljs.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/file-saver@2.0.5/dist/FileSaver.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.28/jspdf.plugin.autotable.min.js"></script>

    <script>window.DOC_LOGO_URL = "img/logo_2n.png";</script>
    <script src="js/firebase.js"></script>
    <script src="js/state.js"></script>
    <script src="js/utils.js"></script>
    <script src="js/ui_login.js"></script>
    <script src="js/ui_shell.js"></script>
    <script src="js/ui_proyecto.js"></script>
    <script src="js/ui_presupuesto.js"></script>
    <script src="js/ui_simulador.js"></script>
    <script type="module" src="js/ui_tarifa.js"></script>
    <script src="js/ui_tarifas.js"></script>
    <script src="js/ui_documentacion.js"></script>
    <script src="js/ui_doc_prescripcion.js"></script>
    <script src="js/ui_diagramas.js"></script>
    <script src="js/ui_doc_gestion.js"></script>
    <script src="js/ui_dashboard_doc.js"></script>
    <script src="js/ui_admin_users.js"></script>
    <script src="js/pdf_excel.js"></script>
    <script src="app.js"></script>
    <script src="js/main.js"></script>
    <!-- Entry Point de Navegación -->
    <script type="module" src="index.tsx"></script>
  </body>
</html>
